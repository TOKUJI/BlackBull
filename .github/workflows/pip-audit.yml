name: pip-audit

# Scans BlackBull's dependency tree against the PyPI advisory
# database and OSV.  Fails the build on known-CVE matches.
#
# Triggers on every push and PR to master so the check appears in
# branch-protection's required-status-checks dropdown for all PRs
# (Dependabot bumps that don't touch pyproject.toml included).
# Weekly schedule catches advisories filed against unchanged
# dependencies between PRs; manual dispatch for ad-hoc runs.
#
# Dependabot security alerts are independent of this workflow and
# will surface a CVE PR even when this job has not yet run.  The
# audit here is a hard gate on CI.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit **every** declared dependency — runtime and all extras —
      # directly via ``pip-audit --requirement``.
      #
      # This used to cover runtime plus the ``compression`` extra only: four
      # packages out of twenty-nine.  ``cryptography`` (fault-injection),
      # ``httpx`` (testing + fault-injection), ``uvloop`` (speed) and
      # ``watchfiles`` (reload) were all unaudited, while ``SECURITY.md``
      # told readers we monitor pip-audit for "our dependency tree" and
      # named uvloop and watchfiles specifically.  Enumerating the extras
      # rather than listing them by name is what stops that drift returning
      # the next time one is added.
      #
      # ``blackbull-protobuf`` is our own sibling package and is audited
      # like any other name — it resolves from PyPI, and an advisory
      # against it is one we would want to see here.
      #
      # We do NOT install BlackBull itself: at release-prep time
      # (e.g. v0.29.0a1) the new version isn't on PyPI yet, so any
      # mode that asks pip-audit to look up BlackBull's metadata fails
      # (404 from PyPI, or "distribution marked as editable" when using
      # an editable install).  Extracting deps from ``pyproject.toml``
      # and feeding them to ``pip-audit -r`` sidesteps both — pip-audit
      # resolves the named packages from PyPI and audits THEIR
      # advisory data, never touching BlackBull's own version.
      - name: Audit BlackBull dependencies
        run: |
          pip install pip-audit
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              cfg = tomllib.load(f)
          deps = list(cfg['project'].get('dependencies', []))
          for extra, items in cfg['project'].get('optional-dependencies', {}).items():
              deps += list(items)
          # Order-stable and de-duplicated so the log diffs cleanly between
          # runs; several packages appear in more than one extra.
          seen, unique = set(), []
          for d in deps:
              if d not in seen:
                  seen.add(d)
                  unique.append(d)
          print('\n'.join(unique))
          " > audit-deps.txt
          echo '--- audit-deps.txt ---'
          cat audit-deps.txt
          echo '----------------------'
          pip-audit --strict --requirement audit-deps.txt --progress-spinner off
