name: CodeQL

# Python static analysis via GitHub's CodeQL.  Runs on every PR
# touching code, on pushes to master, and weekly to catch advisories
# that land between PRs.
#
# Third-party actions pinned to commit SHA per the supply-chain
# hygiene baseline; Dependabot tracks updates in
# .github/dependabot.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 5 * * 1'   # weekly, Monday 05:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write   # required to upload CodeQL results
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28   # v4.37.8
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # Scope quality lint to shipped code (blackbull/ + examples/);
          # ignore tests/bench/templates/docs.  See the config file header.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28   # v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28   # v4.37.8
        with:
          category: '/language:${{ matrix.language }}'
