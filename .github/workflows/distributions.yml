name: Verify distributions

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      verify-release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # so `python -m build` sees full git context if needed

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          # Deliberately pinned, not matrixed: BlackBull is pure Python and
          # builds one `py3-none-any` wheel, so the building interpreter is
          # not recorded in the artefact and a matrix here would produce
          # identical files.  Runtime version coverage is test.yml's job.
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install build

      - name: Refuse a tag that breaks the public API without raising MINOR
        if: inputs.verify-release
        run: |
          python -m pip install 'griffelib>=2.4,<3'
          python -m tools.api_surface release "$GITHUB_REF_NAME"

      - name: Build wheel + sdist
        run: python -m build

      - name: List build artefacts
        run: ls -la dist/

      - name: Upload artefacts for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Python ${{ matrix.python }} / ${{ matrix.distribution }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        distribution: ['*.whl', '*.tar.gz']
    env:
      DISTRIBUTION: ${{ matrix.distribution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/
      - name: Install and smoke-test the built distribution
        working-directory: ${{ runner.temp }}
        run: |
          packages=("$GITHUB_WORKSPACE"/dist/$DISTRIBUTION)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          python -m venv package-test
          py=package-test/bin/python
          "$py" -m pip --isolated install --index-url https://pypi.org/simple "${packages[0]}"
          "$py" -m pip check
          package-test/bin/blackbull --version
          "$py" -I "$GITHUB_WORKSPACE/tools/distribution_smoke.py"
