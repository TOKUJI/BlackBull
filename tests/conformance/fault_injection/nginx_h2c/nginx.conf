# A reference peer for the fault-injection grid's two broken-client cells.
#
# One listener speaks both HTTP/1.1 and h2c (prior knowledge), so cell A and
# cell D can point at the same container.  It answers 200 "ok" for any path
# and method, matching what the differential's BlackBull app does — without
# that, every scenario's path choice shows up as a status difference that
# says nothing about framing.
events { worker_connections 512; }
http {
    access_log off;
    server {
        listen 80;
        http2 on;
        location / { return 200 "ok"; }
    }
}
